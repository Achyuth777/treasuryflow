server.port=8080
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/treasuryflow}
spring.datasource.username=${DATABASE_USER:treasuryflow}
spring.datasource.password=${DATABASE_PASSWORD:local-database-only}
spring.sql.init.mode=always
spring.jackson.serialization.write-dates-as-timestamps=false
bridge.url=${BRIDGE_URL:http://localhost:8546}
bridge.secret=${BRIDGE_SECRET:local-bridge-secret-change-me}
demo.password=${DEMO_PASSWORD:treasury-demo-only}
demo.failpoints=${DEMO_FAILPOINTS:false}
