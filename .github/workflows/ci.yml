name: Verify TreasuryFlow
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - run: npm ci
      - run: npm ci --prefix hosted
      - run: npm run build
      - run: npm test
      - name: Start integration chain
        run: |
          BRIDGE_SECRET=local-bridge-secret-change-me CHAIN_DATA=/tmp/treasury-ci node chain/server.mjs > /tmp/chain.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS -H 'X-Bridge-Secret: local-bridge-secret-change-me' http://localhost:8546/config; then exit 0; fi
            sleep 1
          done
          cat /tmp/chain.log
          exit 1
      - run: mvn -B -f backend/pom.xml test
        env: { LIVE_CHAIN: "true" }
      - name: Compose integration and process restart
        run: |
          docker compose up --build -d
          for i in $(seq 1 90); do
            if curl -fsS -u creator:treasury-demo-only http://localhost:8088/api/config; then break; fi
            sleep 2
          done
          RESTART_BACKEND=true npm run demo:api
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
